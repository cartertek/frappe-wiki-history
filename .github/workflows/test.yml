name: Wiki History / Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q wiki_history
      - run: node --check wiki_history/public/js/history_link.js && node --check wiki_history/public/js/history_page.js
